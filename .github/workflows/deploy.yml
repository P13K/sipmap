name: Construire et publier la carte

# Lundi (et lancement manuel) : on retélécharge OpenStreetMap et on reconstruit les points d'eau.
# Push sur main (changement d'interface) : on réutilise les dernières données en cache, déploiement en ~1 min.
# Si la liste des pays (REGIONS) ou les scripts changent, le cache ne correspond plus : reconstruction complète.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # chaque lundi à 3 h 17 UTC

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # pour enregistrer les données en cache

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # Extraits Geofabrik à traiter (chemins de download.geofabrik.de, sans -latest.osm.pbf).
      # Les Canaries sont rangées sous « africa » chez Geofabrik, les Açores à part du Portugal.
      REGIONS: >-
        europe/france europe/spain africa/canary-islands europe/portugal europe/azores
        europe/italy europe/switzerland europe/belgium
        europe/andorra europe/monaco europe/luxembourg europe/liechtenstein
    steps:
      - uses: actions/checkout@v7

      - name: Clé de cache (pays + scripts)
        id: key
        run: echo "k=$(echo "$REGIONS" | sha1sum | cut -c1-10)-${{ hashFiles('scripts/**') }}" >> "$GITHUB_OUTPUT"

      - name: Récupérer les dernières données en cache
        id: data-cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: site/data
          key: water-${{ steps.key.outputs.k }}-none
          restore-keys: water-${{ steps.key.outputs.k }}-

      - name: Installer osmium
        if: steps.data-cache.outputs.cache-matched-key == ''
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Construire les données des points d'eau
        if: steps.data-cache.outputs.cache-matched-key == ''
        run: bash scripts/build_data.sh

      - name: Mettre les données en cache pour les prochains déploiements
        if: steps.data-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: site/data
          key: water-${{ steps.key.outputs.k }}-${{ github.run_id }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
